name: Bug
description: The skill did the wrong thing in a real session. One bug per issue.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short and put the repro first. If an agent wrote this for you, cut it down to the repro before you post. See [CONTRIBUTING.md](https://github.com/rezkycodes/grill-prd/blob/main/CONTRIBUTING.md).

        Installer problems with `npx skills` belong at [skills.sh](https://skills.sh).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The plugin version, or the commit SHA you installed from. Many bugs are already fixed on `main`.
      placeholder: 0.1.0, or 74ddadc
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: e.g. Claude Code 2.1.319. Say how you installed (plugin, `npx skills`, or manual copy).
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and effort
      description: e.g. Opus, high effort. Roughly how full was the context when it happened?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The smallest steps that show the bug, and what the skill did. Paste the relevant part of the session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the skill should have done instead, and which line of the SKILL.md (if any) says so.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This issue is about one problem.
          required: true
        - label: I searched open and closed issues for a duplicate.
          required: true
