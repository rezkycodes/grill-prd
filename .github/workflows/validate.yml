name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  feature-maps:
    name: Feature map schema and checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate examples and fixtures
        run: npm run validate
